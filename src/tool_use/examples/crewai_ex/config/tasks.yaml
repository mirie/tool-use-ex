finance_question_task:
  description: >
    Answer the user's question: {question}

    Use your tools when the question needs data from them (stock prices, the current
    time, or the user's portfolio); otherwise answer directly. If a tool can't
    provide the data, say so clearly instead of guessing.
  expected_output: >
    A brief, direct answer to the question, in one to three sentences.
  agent: financial_analyst
